[Config]
; Each stage includes the ones below it.
;   0 = inert (loaded, patches nothing)
;   1 = relocate the grid table only
;   2 = + walk the grid as 9 rows of 16 (new cards and portraits appear)
;   3 = + give the new cells their own cards instead of reusing row 0's
;   4 = + tell the cursor the grid is 9 x 16 and let it move onto the new cells
Stage=4

; Character ids written into every added row, left to right across both sides.
; CloneEngine claims each slot from 56 up by index and substitutes its own
; roster there, so these are only ever visible if CE is not installed.
[NewRows]
Slot0=16
Slot1=19
Slot2=18
Slot3=12
Slot4=36
Slot5=29
Slot6=31
Slot7=32
